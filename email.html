<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Week ahead email – Pickleball Cook Islands</title>
<meta name="theme-color" content="#061D01">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<!--
  The week ahead email's page on the website:
  - email.html                            sign-up form (the site's "Sign up" buttons link here)
  - email.html?a=confirm&t=<token>        confirm button (link in the confirmation email)
  - email.html?a=unsub&t=<token>          unsubscribe button (link in every email)
  Nothing changes until a button is pressed, so email link scanners can't confirm or unsubscribe
  anyone. Requests go to the "PCI week ahead email" Apps Script (doPost in apps-script/weekly-email.gs).
-->
<style>
:root{--bg:#061D01;--fg:#FFFFFF;--mute:#9CB893;--acc:#39FF14;--ink:#061D01;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Barlow',Arial,Helvetica,sans-serif;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:440px;width:100%}
img{width:150px;height:auto;display:block;margin:0 auto 28px}
h1{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:800;text-transform:uppercase;
  font-size:clamp(34px,10vw,48px);line-height:1;margin:0}
p{color:var(--mute);font-size:17px;line-height:1.5;margin:14px 0 26px}
p.done{color:var(--fg)}
form{display:grid;gap:12px;text-align:left;margin-top:22px}
label{font-size:14px;font-weight:500;color:var(--mute);display:grid;gap:6px}
input{font:inherit;font-size:17px;padding:12px 14px;border-radius:10px;border:2px solid #244A1B;background:#0B2906;color:var(--fg);width:100%}
input:focus{outline:none;border-color:var(--acc)}
form button{margin-top:6px;width:100%}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.small{font-size:13px;margin:14px 0 0}
button,a.btn{display:inline-block;background:var(--acc);color:var(--ink);border:0;border-radius:10px;padding:12px 24px;cursor:pointer;
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:800;text-transform:uppercase;font-size:19px;letter-spacing:.06em;text-decoration:none}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,a.btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
a.btn.alt{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <img src="assets/img/logo.png" width="260" height="104" alt="Pickleball Cook Islands">
  <h1 id="h">Week ahead email</h1>
  <p id="m">Every Sunday morning: the week's drop-ins, league days and events. Plus a heads-up if this week's sessions change.</p>
  <form id="f" hidden novalidate>
    <label>Email address<input id="email" name="email" type="email" autocomplete="email" inputmode="email" required></label>
    <label>First name (optional)<input id="name" name="name" type="text" autocomplete="given-name" maxlength="60"></label>
    <div class="hp" aria-hidden="true"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <button id="sb" type="submit">Sign me up</button>
  </form>
  <p id="fine" class="small" hidden>We'll email you a link to confirm first. Every email has an unsubscribe link. We only use your address for these emails.</p>
  <button id="b" type="button" hidden></button>
  <a id="home" class="btn alt" href="./" hidden>Pickleball Cook Islands</a>
</main>
<script>
/* The "PCI week ahead email" Apps Script web app (WEB_APP_URL in apps-script/weekly-email.gs). */
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbygABt_F5pdJfIzsPvf0z9LdrEYliDw_qEt_P-MunlyJ0N858A3SiwN6wDTUWjfWiki/exec';

(function () {
  var q = new URLSearchParams(location.search), a = q.get('a'), t = q.get('t') || '';
  var h = document.getElementById('h'), m = document.getElementById('m'),
      b = document.getElementById('b'), home = document.getElementById('home');
  var TEXT = {
    confirm: ['Confirm subscription', 'Start getting the PCI week ahead email every Sunday morning?', 'Yes, subscribe me'],
    unsub: ['Unsubscribe', 'Stop getting the PCI week ahead email?', 'Unsubscribe']
  };
  if (!a) return signupForm();
  if (!TEXT[a] || !/^[0-9a-f-]{36}$/i.test(t)) {
    m.textContent = "This link isn't complete. Try the link in your email again.";
    home.hidden = false; return;
  }
  h.textContent = TEXT[a][0]; m.textContent = TEXT[a][1]; b.textContent = TEXT[a][2]; b.hidden = false;
  document.title = TEXT[a][0] + ' – Pickleball Cook Islands';

  b.onclick = function () {
    b.disabled = true; b.textContent = 'One moment…';
    // A form-encoded POST is a "simple" request, so the browser sends it without a CORS preflight.
    post({ a: a, t: t })
      .then(function (r) {
        m.textContent = r.msg;
        if (!r.ok) throw new Error(r.msg);
        m.className = 'done'; b.hidden = true; home.hidden = false;
      })
      .catch(function () {
        if (!m.textContent || m.textContent === TEXT[a][1]) m.textContent = "That didn't work. Check your connection and try again.";
        b.disabled = false; b.textContent = 'Try again';
      });
  };

  // A form-encoded POST is a "simple" request, so the browser sends it without a CORS preflight.
  function post(data) {
    return fetch(WEB_APP_URL, { method: 'POST', body: new URLSearchParams(data) }).then(function (r) { return r.json(); });
  }

  function signupForm() {
    var f = document.getElementById('f'), sb = document.getElementById('sb'),
        email = document.getElementById('email'), fine = document.getElementById('fine'), intro = m.textContent;
    h.textContent = 'Get the week ahead by email';
    document.title = 'Week ahead email – Pickleball Cook Islands';
    f.hidden = false; fine.hidden = false;
    f.onsubmit = function (ev) {
      ev.preventDefault();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())) {
        m.textContent = "That email address doesn't look right. Check it and try again."; email.focus(); return;
      }
      sb.disabled = true; sb.textContent = 'One moment…'; m.textContent = intro; m.className = '';
      post({ a: 'signup', email: email.value.trim(), name: document.getElementById('name').value.trim(), website: f.elements.website.value })
        .then(function (r) {
          m.textContent = r.msg;
          if (!r.ok) throw new Error(r.msg);
          h.textContent = 'Nearly there'; m.className = 'done'; f.hidden = true; fine.hidden = true; home.hidden = false;
        })
        .catch(function () {
          if (m.textContent === intro) m.textContent = "That didn't work. Check your connection and try again.";
          sb.disabled = false; sb.textContent = 'Sign me up';
        });
    };
  }
})();
</script>
</body>
</html>
