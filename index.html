<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pickleball Cook Islands: what's on, club news, photos, membership and visitor info for pickleball in Rarotonga.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Pickleball Cook Islands</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PCI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
/* Colour mode: light (default) or dark. ?theme=light|dark in the URL wins, then the saved choice. */
(function(){var m='light';try{var q=new URLSearchParams(location.search).get('theme'),s=localStorage.getItem('pci_mode'),o=localStorage.getItem('pci_theme');
q=q==='day'?'light':q==='classic'?'dark':q;m=(q==='light'||q==='dark')?q:(s==='light'||s==='dark')?s:o==='classic'?'dark':'light'}catch(e){}
document.documentElement.dataset.mode=m})();
</script>
<style>
/* Layout: phone-first club app. PCI dark-green ground, fluoro green for club/drop-ins, TJ yellow + crab for the league, PCI green as the one accent, bottom tab bar, date-led cards. */
:root{
  --bg:#061D01; --bg2:#0B2906; --bg3:#12360C; --line:#244A1B;
  --fg:#FFFFFF; --mute:#9CB893; --acc:#39FF14; --ink:#061D01;
  --tj:#F2DA1A;
  --d1:#F4FF00; --d2:#FF7A00; --d3:#FF2B2B;
  --pink:#FA00BE; --pink-bg:#2A0018;
  --cio-bg:#0E011F; --cio-pink:#FA34BC; --cio-purple:#C11ABA; --cio-lilac:#F066F0; --cio-cyan:#00F8F8;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg2);border-bottom:2px solid var(--acc);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
header img{height:38px;width:auto}
header .t{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;line-height:1.1}
header .t b{display:block;color:var(--fg);font-size:20px;letter-spacing:.06em}

main{max-width:720px;margin:0 auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;margin:4px 0 0;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.lbl{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:8px 0 -4px}
.note{color:var(--mute);font-size:14px;margin:0}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:18px 0 6px}
.hero img{width:min(280px,72vw);height:auto}
.hero p{margin:0;font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-size:15px}

/* next up */
.next.pk{background:var(--pink);color:#fff} .next.pk .dt{background:var(--pink-bg);color:#fff} .next.pk .dt i{color:var(--pink)}
.next.tjn{background:var(--tj)} .next.tjn .dt{color:var(--tj)} .next.tjn .dt i{color:var(--tj)}
.next .crab{height:24px}
.next{background:var(--acc);color:var(--ink);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;border:0;font:inherit;text-align:left;cursor:pointer;width:100%}
.next .k{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase}
.next .h{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;text-transform:uppercase}
.next .s{font-size:14px;font-weight:500}
.next .txt{min-width:0}

/* date block shared by events */
.dt{flex:0 0 58px;text-align:center;border-radius:10px;padding:6px 0;background:var(--bg);color:var(--fg);font-family:var(--display);line-height:1}
.dt i{display:block;font-style:normal;font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--mute)}
.dt b{display:block;font-size:28px;font-weight:800;margin:2px 0}
.next .dt{background:var(--ink);color:var(--acc)}
.next .dt i{color:var(--acc)}

/* events */
.month{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg);margin:10px 0 -6px}
.ev{display:flex;gap:14px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ev .txt{min-width:0;flex:1}
.ev h3{margin:0;font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em}
.ev .w{color:var(--mute);font-size:14px;margin-top:2px}
.ev ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.ev li{font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--bg3);color:var(--fg)}
.tag{display:inline-block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:4px;margin-bottom:4px}
.tag.moved{background:#fff;color:var(--ink);margin-left:6px}
.tag.league{background:var(--tj);color:var(--ink)} .tag.dropin{background:var(--acc);color:var(--ink)} .tag.special{background:var(--pink);color:#fff} .tag.tourn{background:var(--cio-pink);color:var(--cio-bg)} .tag.social{background:var(--bg3);color:var(--fg)}
.ev.dropin h3,.ev.dropin .dt b{color:var(--acc)}
.ev.special{background:var(--pink-bg);border:2px solid var(--pink);box-shadow:0 0 14px rgba(250,0,190,.35)} .ev.special h3{color:var(--pink);font-size:24px} .ev.special .w{color:#fff}
.ev.special .dt{background:var(--pink);color:#fff} .ev.special .dt i{color:#fff}
.ev.league{border-color:#4A4A12;color:inherit;text-decoration:none;cursor:pointer}
.ev.league .golink{margin-top:8px;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--tj)}
.ev.league:active{background:var(--bg3)}
.ev.league h3,.ev.league .w,.ev.league .dt b,.ev.league .dt i{color:var(--tj)}
.ev.league li{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;padding:3px 11px;text-transform:uppercase}
.ev.league li.d1{background:var(--d1);color:var(--ink)} .ev.league li.d2{background:var(--d2);color:var(--ink)} .ev.league li.d3{background:var(--d3);color:var(--ink)}
.crab{height:18px;width:auto;vertical-align:-4px;margin-right:6px}
.ev .crab{height:20px}
.ev.tourn{background:var(--cio-bg);border-color:var(--cio-purple)} .ev.tourn h3{color:var(--cio-pink)} .ev.tourn .w{color:var(--cio-lilac)}
.ev.tourn .dt{background:var(--cio-purple);color:#fff} .ev.tourn .dt i{color:var(--cio-cyan)}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters button{flex:0 0 auto;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:none;color:var(--mute);cursor:pointer}
.filters button.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}

/* news */
.news{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.news .d{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.news.pk{background:var(--pink-bg);border:2px solid var(--pink)} .news.pk .d,.news.pk h3{color:var(--pink)}
.news img.poster{display:block;width:100%;max-width:100%;height:auto;border-radius:10px;margin-top:12px}
.news.tj{border-color:#4A4A12} .news.tj .d,.news.tj h3,.news.tj p{color:var(--tj)}
.news .readmore{display:inline-block;margin-top:10px;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;padding:9px 14px;border-radius:9px;border:2px solid var(--acc);color:var(--acc)}
.news h3{margin:2px 0 6px;font-family:var(--display);font-weight:800;font-size:23px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.news p{margin:0;max-width:62ch}

/* link cards */
.links{display:flex;flex-direction:column;gap:10px}
.lk{display:flex;align-items:center;gap:14px;border-radius:14px;padding:14px 16px;background:var(--bg2);border:2px solid var(--line)}
.lk .ic{flex:0 0 44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.lk .txt{min-width:0;flex:1}
.lk b{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;text-transform:uppercase}
.lk span{display:block;font-size:14px;color:var(--mute)}
.lk .go{font-family:var(--display);font-weight:800;font-size:22px;color:var(--acc)}
.lk.tj{border-color:var(--tj)} .lk.tj .ic{background:none} .lk.tj .ic img{width:44px;height:auto} .lk.tj b,.lk.tj span,.lk.tj .go{color:var(--tj)}
.lk.open{background:var(--cio-bg);border-color:var(--cio-pink)} .lk.open .ic{background:none;overflow:hidden} .lk.open .ic img{width:44px;height:auto}
.lk.open b{color:#fff} .lk.open span{color:var(--cio-cyan)} .lk.open.soon .go{color:var(--cio-pink)}
.lk.fb .ic{background:#1877F2;color:#fff}
.lk.soon{border-style:dashed} .lk.soon .go{color:var(--mute);font-size:14px;letter-spacing:.1em}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;font:inherit;color:var(--fg)}
.tile.tjt{border-color:var(--tj)} .tile.tjt b,.tile.tjt span{color:var(--tj)}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--acc)}
.tile span{display:block;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:4px}

/* photos */
.ph-empty{border:2px dashed var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ph-empty h3{margin:0;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.05}
.ph-empty p{margin:0;color:var(--mute);max-width:52ch}
.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ph-grid i{aspect-ratio:1;max-width:100%;border-radius:6px;background:repeating-linear-gradient(135deg,var(--bg2) 0 10px,var(--bg3) 10px 20px)}
.btn{display:inline-block;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:10px 18px;border-radius:10px;background:var(--acc);color:var(--ink)}

/* open teaser */
.open-card{border-radius:14px;padding:18px 16px;background:var(--cio-bg);border:2px solid var(--cio-pink);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.open-card img{width:min(200px,60%);height:auto}
.open-card .k{font-family:var(--display);font-weight:700;letter-spacing:.16em;font-size:15px;color:var(--cio-cyan);text-transform:uppercase}
.open-card b{display:block;font-family:var(--display);font-weight:800;font-size:36px;line-height:.95;text-transform:uppercase;margin:2px 0;color:#fff}
.open-card b em{display:block;font-style:normal;color:var(--cio-pink)}
.open-card p{margin:0;color:var(--cio-lilac);font-size:15px;max-width:44ch}

/* visitors + members */
.vhero{border-radius:16px;padding:20px 18px;background:var(--bg2);border:2px solid var(--acc);display:flex;flex-direction:column;gap:6px}
.vhero .k{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.vhero h3{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,48px);line-height:.92;text-transform:uppercase;text-wrap:balance}
.vhero h3 em{font-style:normal;color:var(--acc)}
.vhero p{margin:4px 0 0;color:var(--mute);max-width:52ch}
.price{display:flex;align-items:center;gap:16px;border-radius:16px;padding:16px 18px;background:var(--acc);color:var(--ink)}
.price .amt{font-family:var(--display);font-weight:800;font-size:64px;line-height:.85;font-variant-numeric:tabular-nums}
.price .amt sup{font-size:28px;vertical-align:top;margin-right:2px}
.price .what{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;text-transform:uppercase;min-width:0}
.price .what span{display:block;font-family:var(--body);font-weight:600;font-size:14px;text-transform:none;letter-spacing:0;margin-top:4px}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{display:flex;gap:14px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
.steps li::before{counter-increment:st;content:counter(st);flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:var(--ink);font-family:var(--display);font-weight:800;font-size:22px}
.steps b{display:block;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1;text-transform:uppercase}
.steps p{margin:2px 0 0;color:var(--mute);font-size:15px}
.steps .txt{min-width:0;flex:1}
.free{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.free div{border:2px dashed var(--acc);border-radius:12px;padding:14px 12px;text-align:center}
.free b{display:block;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;color:var(--acc);line-height:1}
.free span{display:block;font-size:14px;color:var(--mute);margin-top:4px}
.sess{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sess div{display:flex;justify-content:space-between;gap:10px;font-size:15px;border-top:1px solid var(--line);padding-top:6px}
.sess div b{font-family:var(--display);font-weight:700;font-size:17px;color:var(--acc);text-transform:uppercase;letter-spacing:.04em}
.sess div span{color:var(--fg);text-align:right}
.fees{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fee{border-radius:14px;padding:16px 14px;background:var(--bg2);border:2px solid var(--line);display:flex;flex-direction:column;gap:4px}
.fee.fam{border-color:var(--acc)} .fee.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px} .fee.wide .amt{order:-1}
.fee .n{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.fee .amt{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;color:var(--acc);font-variant-numeric:tabular-nums}
.fee .amt small{font-size:16px;color:var(--mute);letter-spacing:.06em}
.conc{display:flex;align-items:center;gap:10px;width:100%;margin-top:-4px;background:none;border:1px dashed var(--line);border-radius:10px;padding:9px 12px;color:var(--mute);font-family:var(--body);font-size:13px;text-align:left;cursor:pointer}
.conc b{color:var(--fg);font-weight:600}
.conc span{flex:1;min-width:0}
.conc i{font-style:normal;font-size:18px}
.fee p{margin:0;font-size:14px;color:var(--mute)}
.bank{border-radius:14px;padding:14px 16px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.bank .row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.bank .row span{color:var(--mute)}
.bank .row b{font-weight:600;text-align:right;overflow-wrap:anywhere;user-select:all}
.bank .tbc{color:var(--tj);font-weight:600}
.copy{font:inherit;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:8px;border:1px solid var(--acc);background:none;color:var(--acc);cursor:pointer;margin-left:8px}
.btn.wide{display:block;text-align:center}
.btn.off{background:none;border:2px dashed var(--line);color:var(--mute)}
.vband{display:flex;align-items:center;gap:14px;border-radius:14px;padding:14px 16px;background:var(--bg2);border:2px solid var(--acc);cursor:pointer;font:inherit;color:var(--fg);text-align:left;width:100%}
.vband b{display:block;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.05}
.vband span{display:block;font-size:14px;color:var(--mute)}
.vband .go{font-family:var(--display);font-weight:800;font-size:22px;color:var(--acc);margin-left:auto}
.vband .txt{min-width:0}
/* faq + venues */
.seg{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;padding:9px 4px;border-radius:9px;border:0;background:none;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--acc);color:var(--ink)}
.venue{border-radius:14px;background:var(--bg2);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:8px}
.venue .k{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.venue h3{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase}
.venue h3 small{display:block;font-size:15px;color:var(--mute);letter-spacing:.08em;margin-top:4px}
.venue p{margin:0;color:var(--mute);font-size:15px}
.venue .uses{display:flex;flex-wrap:wrap;gap:6px}
.venue .uses span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg3)}
.venue .uses span.tj{background:none;border:1px solid var(--tj);color:var(--tj)}
.venue .uses span.dp{background:var(--acc);color:var(--ink)}
.venue .uses span.pk{background:var(--pink);color:#fff}
.venue .acts{display:flex;gap:8px}
.venue .acts a{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;padding:11px 6px;border-radius:10px;background:var(--acc);color:var(--ink)}
.venue .acts a.alt{background:none;border:2px solid var(--acc);color:var(--acc)}
.pin{display:inline-block;width:10px;height:10px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:currentColor;margin-right:6px;vertical-align:1px}
.ev .w a{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
details.qa{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.qa summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;padding:14px 0;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15;text-transform:uppercase}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::after{content:'+';color:var(--acc);font-size:24px;line-height:1}
details.qa[open] summary::after{content:'–'}
details.qa p{margin:0 0 14px;color:var(--mute);max-width:60ch}
details.qa p a{color:var(--acc);text-decoration:underline}
.qas{display:flex;flex-direction:column;gap:8px}
/* hall of fame */
:root{--gold:#E8C14E; --silver:#C9D2D6}
.hof-hero{text-align:center;padding:14px 8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px}
.hof-hero svg{width:56px;height:56px}
.hof-hero h2{margin:0}
.hof-hero p{margin:0;color:var(--mute);max-width:46ch;font-size:15px}
.shelf{border-radius:16px;background:var(--bg2);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 -6px 0 #031200}
.shelf.tj{border-color:#4A4A12}
.shelf.biz{border-color:var(--line)}
.shelf.cio{background:var(--cio-bg);border-color:var(--cio-purple)}
.shelf-h{display:flex;align-items:center;gap:10px}
.shelf-h img{height:30px;width:auto}
.shelf-h .txt{min-width:0;flex:1}
.shelf-h b{display:block;font-family:var(--display);font-weight:800;font-size:23px;line-height:1.05;text-transform:uppercase}
.shelf-h span{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--display);font-weight:700;color:var(--mute)}
.shelf.tj .shelf-h b{color:var(--tj)}
.shelf.cio .shelf-h b{color:var(--cio-pink)} .shelf.cio .shelf-h span{color:var(--cio-cyan)}
.divlbl{display:inline-block;align-self:flex-start;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:3px 12px;border-radius:999px}
.divlbl.d1{background:var(--d1);color:var(--ink)} .divlbl.d2{background:var(--d2);color:var(--ink)} .divlbl.d3{background:var(--d3);color:#fff}
.podium{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plaque{border-radius:12px;overflow:hidden;background:var(--bg);border:2px solid var(--silver);display:flex;flex-direction:column;min-width:0}
.plaque.gold{border-color:var(--gold)}
.plaque .ph{position:relative;aspect-ratio:4/5;max-width:100%;background:repeating-linear-gradient(135deg,var(--bg2) 0 10px,var(--bg3) 10px 20px)}
.plaque .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.plaque .medal{display:block;text-align:center;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:5px 8px;background:var(--silver);color:var(--ink)}
.plaque.gold .medal{background:var(--gold)}
.plaque .cap{padding:8px 10px 10px}
.plaque .cap b{display:block;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.plaque.gold .cap b{color:var(--gold)}
.plaque .cap span{display:block;font-size:13px;color:var(--mute);line-height:1.3;margin-top:2px}
.plaque.tbc .cap b{color:var(--mute)}
.plaque.tbc .ph::after{content:'?';position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:48px;color:var(--line)}
.plaque.solo{grid-column:1/-1}
.plaque.solo .ph{aspect-ratio:4/3}
.shelf .note{font-size:13px}
.catlbl{display:inline-block;align-self:flex-start;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:3px 12px;border-radius:999px;background:var(--cio-pink);color:var(--cio-bg)}
.shelf.cio .plaque{background:#1A0833;border-color:var(--cio-purple)} .shelf.cio .plaque.gold{border-color:var(--gold)}
.shelf.cio .plaque .ph{aspect-ratio:1/1;background:#1A0833}
.shelf.cio .plaque .cap span{color:var(--cio-lilac)}
.cc{font-style:normal;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;padding:1px 5px;border-radius:4px;background:var(--bg3);color:var(--fg);vertical-align:2px}
.shelf.cio .cc{background:var(--cio-purple);color:#fff}

/* gear swap */
.gear-top{display:flex;flex-direction:column;gap:8px}
.gear-top p{margin:0;color:var(--mute);font-size:15px;max-width:52ch}
.gear-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.item{border-radius:14px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.item .ph{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--bg3)}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block}
.item .price{position:absolute;right:8px;bottom:8px;font-family:var(--display);font-weight:800;font-size:22px;line-height:1;padding:6px 10px;border-radius:8px;background:var(--acc);color:var(--ink);font-variant-numeric:tabular-nums}
.item .price.swap{background:var(--tj)} .item .price.free{background:#fff}
.item .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.item h3{margin:0;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.item .chips{display:flex;flex-wrap:wrap;gap:6px}
.item .chips span{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--bg3)}
.item .chips span.new{background:var(--acc);color:var(--ink)}
.item p{margin:0;color:var(--mute);font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.item .who{font-size:13px;color:var(--mute)}
.item .who b{color:var(--fg);font-weight:600}
.item .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.item .acts a,.item .acts button{flex:1 1 auto;text-align:center;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;padding:10px 8px;border-radius:10px;border:2px solid var(--acc);background:none;color:var(--acc);cursor:pointer}
.item .acts a.wa{background:#25D366;border-color:#25D366;color:#062}
.item .contact{font-size:14px;overflow-wrap:anywhere;user-select:all}
.gear-empty{border:2px dashed var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:10px}
.gear-empty h3{margin:0;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.05}
.gear-empty p{margin:0;color:var(--mute);max-width:52ch}
.gear-empty ol{margin:0;padding-left:20px;color:var(--mute);font-size:15px;display:flex;flex-direction:column;gap:4px}
/* home menu */
.evlink{cursor:pointer}
.seemore{align-self:flex-end;background:none;border:0;color:var(--acc);font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:2px 0;cursor:pointer}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.mtile{display:flex;align-items:center;gap:10px;min-height:76px;background:var(--bg2);border:2px solid var(--acc);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--fg);font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.mtile i{flex:0 0 auto;font-style:normal;font-size:28px;line-height:1}
.mtile span{min-width:0}
.mtile:active{background:var(--bg3)}
.mlist{display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mlist button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:14px 16px;color:var(--fg);font-family:var(--body);font-weight:600;font-size:17px;text-align:left;cursor:pointer}
.mlist button:first-child{border-top:0}
.mlist button i{font-style:normal;font-size:20px;width:26px;text-align:center}
.mlist button span{flex:1}
.mlist button b{font-size:24px;line-height:1;color:var(--mute);font-weight:400}
.mlist button:active{background:var(--bg3)}
.back{align-self:flex-start;background:none;border:0;color:var(--acc);font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:2px 0;cursor:pointer}
/* photos */
.album{display:flex;flex-direction:column;gap:10px}
.album-h b{display:block;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.05;text-transform:uppercase;color:var(--acc)}
.album-h span{display:block;font-size:14px;color:var(--mute)}
.ph-grid .ph{display:block;padding:0;border:0;background:var(--bg2);border-radius:6px;overflow:hidden;cursor:pointer;aspect-ratio:1;max-width:100%}
.ph-grid .ph img{width:100%;height:100%;object-fit:cover;display:block}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:calc(48px + env(safe-area-inset-top,0px)) 8px calc(40px + env(safe-area-inset-bottom,0px))}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
#lb button{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:30px;line-height:1;width:46px;height:46px;border-radius:50%;cursor:pointer}
.lb-x{top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));font-size:22px !important}
.lb-p{left:calc(6px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.lb-n{right:calc(6px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.lb-c{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#ccc;font-size:14px}
footer.pres{display:flex;justify-content:center;color:var(--mute);font-family:var(--display);font-weight:600;letter-spacing:.14em;font-size:13px;text-transform:uppercase;padding-top:8px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;background:var(--bg2);border-top:2px solid var(--acc);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{flex:1;min-width:0;background:none;border:0;color:var(--mute);font-family:var(--display);font-weight:700;font-size:clamp(12px,3.6vw,15px);letter-spacing:.08em;text-transform:uppercase;padding:15px 0 13px;cursor:pointer}
.tabs button.on{color:var(--fg);background:rgba(255,255,255,.08);box-shadow:inset 0 3px 0 var(--acc)}
header .brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
header .t{display:block}

/* desktop: tab bar moves to a row under the header */
@media (min-width:900px){
  :root{--hh:61px}
  body{padding-bottom:0}
  .tabs{top:calc(var(--hh) + env(safe-area-inset-top,0px));left:0;right:0;bottom:auto;width:auto;flex-direction:row;justify-content:center;gap:4px;border-top:0;border-bottom:1px solid var(--line);padding:0}
  .tabs button{flex:0 0 auto;padding:13px 20px;font-size:17px}
  .tabs button:hover{color:var(--fg);background:var(--bg3)}
  .tabs button.on{box-shadow:inset 0 -3px 0 var(--acc);background:none}
  main{max-width:1120px;padding-block:84px 40px}
}
@media (prefers-reduced-motion:no-preference){main{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
/* ===== Colour modes. Base palette above is dark mode; light mode overrides it here ===== */
.themebtn{margin-left:auto;flex:0 0 auto;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:999px;border:2px solid var(--acc);background:none;color:var(--acc);cursor:pointer}
html[data-mode=light]{--bg:#F3EFE4;--bg2:#FFFFFF;--bg3:#ECE6D6;--line:#DCD6C4;--fg:#061D01;--mute:#4A5A44;--acc:#061D01;--ink:#39FF14;color-scheme:light}
html[data-mode=light] header{border-bottom-color:#061D01}
html[data-mode=light] header img{background:#061D01;border-radius:6px;padding:4px 8px}
html[data-mode=light] .tabs{border-top-color:#061D01}
html[data-mode=light] .tabs button.on{background:rgba(6,29,1,.06)}
html[data-mode=light] .ev.league,html[data-mode=light] .news.tj,html[data-mode=light] .lk.tj{background:#F2DA1A;border-color:#F2DA1A}
html[data-mode=light] .ev.league h3,html[data-mode=light] .ev.league .w,html[data-mode=light] .ev.league .dt b,html[data-mode=light] .ev.league .dt i,html[data-mode=light] .ev.league .golink,html[data-mode=light] .news.tj .d,html[data-mode=light] .news.tj h3,html[data-mode=light] .news.tj p,html[data-mode=light] .lk.tj b,html[data-mode=light] .lk.tj span,html[data-mode=light] .lk.tj .go,html[data-mode=light] .tile.tjt b,html[data-mode=light] .tile.tjt span,html[data-mode=light] .shelf.tj .shelf-h b,html[data-mode=light] .venue .uses span.tj,html[data-mode=light] .bank .tbc,html[data-mode=light] .plaque.gold .cap b{color:#061D01}
html[data-mode=light] .ev.league .dt{background:#FFFFFF}
html[data-mode=light] .news.pk{color:#fff}
/* Light mode: --ink is fluoro here, so text that sits on yellow, division colours or white uses dark ink instead */
html[data-mode=light] .tag.league{background:#061D01;color:#F2DA1A}
html[data-mode=light] .tag.moved,html[data-mode=light] .ev.league li,html[data-mode=light] .divlbl.d1,html[data-mode=light] .divlbl.d2{color:#061D01}
html[data-mode=light] .ev.league li,html[data-mode=light] .divlbl.d1,html[data-mode=light] .divlbl.d2{box-shadow:inset 0 0 0 2px #061D01}
html[data-mode=light] .plaque .medal{color:#061D01}
html[data-mode=light] .shelf.tj .shelf-h img{background:#061D01;border-radius:8px;padding:5px;height:40px}
html[data-mode=light] .shelf.tj{border-color:#D9BF00;border-width:2px}
html[data-mode=light] .ev.league .crab,html[data-mode=light] .news.tj .crab,html[data-mode=light] .lk.tj .ic img{filter:brightness(0)}
.dcol .news p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;line-clamp:4;overflow:hidden}
html[data-mode=light] .venue .uses span.tj{border-color:#C9B100;background:#F2DA1A}
html[data-mode=light] .shelf{box-shadow:inset 0 -6px 0 var(--line)}
html[data-mode=light] .hof-hero svg *{fill:#C9A227;stroke:#C9A227}
.dhero{display:grid;grid-template-columns:minmax(0,1fr);border-radius:20px;overflow:hidden;background:#061D01;color:#fff}
.dh-t{padding:20px 22px 24px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.dh-t .k{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#39FF14}
.dh-t h2{font-size:clamp(44px,11vw,76px);line-height:.88;margin:0;color:#fff}
.dh-t h2 em{font-style:normal;color:#39FF14}
.dh-t p{margin:0;color:#D5E3CF;max-width:42ch}
.dh-b{display:flex;gap:10px;flex-wrap:wrap}
.dh-b .btn{border:0;cursor:pointer;background:#39FF14;color:#061D01}
.dh-b .btn.ghost{background:none;border:2px solid #fff;color:#fff;padding:8px 16px}
.dnext .k{display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:#9CB893}
.dnext .when{background:#39FF14;color:#061D01;border-radius:999px;padding:3px 11px;letter-spacing:.08em;font-weight:800}
.dnext .when.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:7px;vertical-align:1px}
@media (prefers-reduced-motion:no-preference){.dnext .when.live::before{animation:livepulse 1.4s ease-in-out infinite}@keyframes livepulse{50%{opacity:.25}}}
.dnext .mv{background:#fff;color:#061D01;border-radius:999px;padding:3px 11px;letter-spacing:.08em;font-weight:800}
.dhero .dnext h2{font-size:clamp(44px,11vw,68px);line-height:.9;margin:0;color:#fff}
.dnext h2 .nw{white-space:nowrap}
.dnext .what{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;text-transform:uppercase;color:#39FF14}
.dnext .where{color:#D5E3CF;font-size:17px}
.dnext .divs{color:#D5E3CF;font-size:15px}
.dnext .then{border-top:1px solid #244A1B;padding-top:12px;margin-top:4px;font-size:15px;color:#9CB893}
.dnext .then b{color:#fff;font-weight:600}
.dnext.league .what{color:#F2DA1A}.dnext.league .when{background:#F2DA1A;color:#061D01}
.dnext.special .what{color:#FF5AD9}.dnext.special .when{background:#FA00BE;color:#fff}
.dhi{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px}
.dhi>div{display:flex;flex-direction:column;gap:12px;min-width:0}
.dhi .k{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.dhi h2{font-size:clamp(36px,6vw,54px);line-height:1.02;margin:0}
.dhi h2 em{font-style:normal;background:#39FF14;color:#061D01;padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.dhi p{margin:0;color:var(--mute)}
.dhi .dh-b .btn{border:0;cursor:pointer}
.dhi .dh-b .btn.ghost{background:none;border:2px solid var(--fg);color:var(--fg);padding:8px 16px}
.dcar{order:-2;position:relative;aspect-ratio:3/2;background:#0B2906}
.dcar-track{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.dcar-track::-webkit-scrollbar{display:none}
.dcar-track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;scroll-snap-stop:always}
.dcar-track img.fit{object-fit:contain}
.dcar-nav{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;align-items:center;gap:10px;padding:36px 14px 12px;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0));pointer-events:none}
.dcar-nav>*{pointer-events:auto}
.dcar-dots{display:flex;gap:5px;flex:1;min-width:0}
.dcar-dots button{flex:1;max-width:28px;height:4px;padding:0;border:0;border-radius:2px;background:rgba(255,255,255,.45);cursor:pointer;position:relative}
.dcar-dots button::before{content:"";position:absolute;inset:-10px 0}
.dcar-dots button.on{background:#39FF14}
.dcar-n{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;white-space:nowrap}
.dcar-nav .ar{width:40px;height:40px;flex:0 0 40px;padding:0;border-radius:50%;border:0;background:rgba(6,29,1,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;cursor:pointer;display:grid;place-items:center;transition:background-color .15s,color .15s}
.dcar-nav .ar svg{display:block}
.dcar-nav .ar:hover{background:#39FF14;color:#061D01}
.dcar-nav .ar:active{transform:scale(.94)}
.dcar-nav .ar:focus-visible{outline:3px solid #39FF14;outline-offset:2px}
.dcar-nav .ar+.ar{margin-left:-2px}
.wk{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(118px,1fr);gap:8px;overflow-x:auto;scrollbar-width:none}
.wd{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.wd>b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.wd.now{background:#061D01;border-color:#061D01;color:#fff}.wd.now>b{color:#39FF14}
.wd.lg{border:2px solid #F2DA1A;padding:11px}
.ws{display:block;background:var(--bg);border-radius:8px;padding:8px;font-size:14px;line-height:1.3}
.ws i{display:block;font-style:normal;font-weight:600}
.wd.now .ws{background:#39FF14;color:#061D01}
.wd .ws.done,.wd.now .ws.done{background:none;color:inherit;opacity:.55;box-shadow:inset 0 0 0 1px currentColor}
.wd .ws.done i{text-decoration:line-through}
.ws.league{background:#F2DA1A;color:#061D01}.ws.special{background:#FA00BE;color:#fff}.ws.tourn{background:#0E011F;color:#fff}
.wd em{font-style:normal;font-size:14px;color:var(--mute)}
html[data-mode=dark] .dhero,html[data-mode=dark] .dfees{background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line)}
html[data-mode=dark] .wd.now{background:var(--bg3);border-color:var(--acc)}
.dgrid{display:grid;gap:14px}
.dcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.dfees{background:#061D01;color:#fff;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.dfees div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid #244A1B;padding-bottom:8px}
.dfees span{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:#9CB893}
.dfees b{font-family:var(--display);font-weight:800;font-size:28px;color:#39FF14;white-space:nowrap}

const TZ='-10:00';
const today=new Date(new Date().toLocaleString('en-US',{timeZone:'Pacific/Rarotonga'}));today.setHours(0,0,0,0);
const parse=d=>d.length===7?null:new Date(d+'T00:00:00');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const DAY=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function allEvents(){const out=EVENTS.slice();
  for(let i=0;i<DROPIN_WEEKS*7;i++){const d=new Date(today);d.setDate(d.getDate()+i);
    if(EVENTS.some(e=>e.kind==='special'&&e.date===iso(d)))continue;
    DROPINS.filter(x=>x.day===d.getDay()).forEach(x=>{const ch=DROPIN_CHANGES.find(c=>c.date===iso(d)&&c.time===x.time);out.push({date:iso(d),kind:'dropin',title:'Members Drop-in Session',time:x.time,place:ch?ch.place:x.place,moved:!!ch})})}
  const key=e=>e.date.length===7?e.date+'-99':e.date;
  const tm=e=>{const t=(e.time||'1:00pm').split('–')[0];const h=parseInt(t)%12;return /pm/.test(t)?h+12:h};
  return out.sort((a,b)=>key(a)<key(b)?-1:key(a)>key(b)?1:tm(a)-tm(b))}
function upcoming(){return allEvents().filter(e=>{const d=parse(e.date);return !d||d>=today})}
function dateBlock(e){const d=parse(e.date);
  if(!d){const [y,m]=e.date.split('-');return `<div class="dt"><i>${MON[m-1]}</i><b>${y.slice(2)}</b><i>TBC</i></div>`}
  return `<div class="dt"><i>${DAY[d.getDay()]}</i><b>${d.getDate()}</b><i>${MON[d.getMonth()]}</i></div>`}
const KIND={league:"Trader Jack's Pickleball League",dropin:'Members drop-in',special:'Special event',tourn:'Tournament',social:'Social'};
function evCard(e){
  const chips=e.divs?`<ul>${e.divs.map(([n,t])=>`<li class="d${n}">${esc(t)}</li>`).join('')}</ul>`:'';
  const lg=e.kind==='league';
  const pl=!lg&&e.place&&VENUES[e.place]?`<a href="${mapUrl(VENUES[e.place])}" target="_blank" rel="noopener">${esc(e.place)}</a>`:(e.place?esc(e.place):'');
  const w=[e.time?esc(e.time):'',pl].filter(Boolean).join(' · ');
  const open=lg?`<a class="ev ${e.kind}" href="${leagueUrl(e.league)}">`:`<div class="ev ${e.kind}${e.big?' big':''}">`;
  return `${open}${dateBlock(e)}<div class="txt"><span class="tag ${e.kind}">${KIND[e.kind]}</span>${e.moved?'<span class="tag moved">Venue change</span>':''}<h3>${e.kind==='league'?`<img class="crab" src="${CRAB}" alt="">`:''}${esc(e.title)}</h3><div class="w">${w}</div>${chips}${e.note?`<div class="w">${esc(e.note)}</div>`:''}${lg?`<div class="golink">Fixtures &amp; ladders →</div>`:''}</div>${lg?'</a>':'</div>'}`}
function newsCard(n){return `<article class="news${n.tj?' tj':''}${n.pink?' pk':''}"><div class="d">${esc(n.date)}</div><h3>${n.tj?`<img class="crab" src="${CRAB}" alt="">`:''}${esc(n.title)}</h3><p>${esc(n.text)}</p>${n.url?`<a class="readmore" href="${esc(n.url)}" target="_blank" rel="noopener">Read on ${esc(n.src||'the web')} →</a>`:''}${n.img==='poster'?`<img class="poster" src="${PINK_POSTER}" alt="Pickle in Pink poster: free open public session, Breast Cancer Awareness special event, Mon 26 Oct 5–7pm at TSA">`:''}</article>`}

</div>`}

function applyTheme(){document.documentElement.dataset.mode=mode;const dark=mode==='dark';

function weekStrip(){const ev=allEvents(),now=new Date(new Date().toLocaleString('en-US',{timeZone:'Pacific/Rarotonga'})),nm=now.getHours()*60+now.getMinutes();let h='<div class="wk">';

return h+'</div>'}
function heroCarousel(){if(!HERO_PHOTOS.length)return '';const N=HERO_PHOTOS.length,pad=n=>String(n).padStart(2,'0');
return `<div class="dcar" role="region" aria-roledescription="carousel" aria-label="Club photos"><div class="dcar-track" tabindex="0">${HERO_PHOTOS.map((p,i)=>`<img src="${p.src}" alt="${esc(p.alt)}" class="${p.fit?'fit':''}"${p.pos?` style="object-position:${p.pos}"`:''}${i?' loading="lazy"':''} aria-roledescription="slide" aria-label="${i+1} of ${N}">`).join('')}</div>
<div class="dcar-nav"><div class="dcar-dots">${HERO_PHOTOS.map((_,i)=>`<button data-car="${i}" class="${i?'':'on'}" aria-label="Show photo ${i+1}"></button>`).join('')}</div><span class="dcar-n" aria-live="polite">${pad(1)} / ${pad(N)}</span><button class="ar" data-car="prev" aria-label="Previous photo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="ar" data-car="next" aria-label="Next photo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>`}
let carTimer=null,carHold=false;
function carGo(n){const t=document.querySelector('.dcar-track');if(!t)return;const N=t.children.length;n=(n+N)%N;t.scrollTo({left:n*t.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function carIdx(){const t=document.querySelector('.dcar-track');return t?Math.round(t.scrollLeft/t.clientWidth):0}
function initCarousel(){clearInterval(carTimer);carTimer=null;const t=document.querySelector('.dcar-track');if(!t)return;
const N=t.children.length,pad=n=>String(n).padStart(2,'0'),dots=document.querySelectorAll('.dcar-dots button'),num=document.querySelector('.dcar-n');let last=0,raf=0;
t.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const i=carIdx();if(i===last)return;last=i;dots.forEach((d,k)=>d.classList.toggle('on',k===i));if(num)num.textContent=`${pad(i+1)} / ${pad(N)}`})},{passive:true});
const box=t.closest('.dhero');['pointerenter','focusin','touchstart'].forEach(ev=>box.addEventListener(ev,()=>{carHold=true},{passive:true}));['pointerleave','focusout'].forEach(ev=>box.addEventListener(ev,()=>{carHold=false}));
if(N>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)carTimer=setInterval(()=>{if(!carHold&&!document.hidden)carGo(carIdx()+1)},6000)}
function hm(t){const m=/(\d{1,2})(?::(\d\d))?\s*(am|pm)/i.exec(t||'');if(!m)return null;return (+m[1]%12+(m[3].toLowerCase()==='pm'?12:0))*60+(+m[2]||0)}
function evSpan(e){const [a,b]=(e.time||'').split('–');let s=hm(a),f=hm(b);if(s==null)s=e.kind==='league'?13*60:0;if(f==null)f=e.kind==='league'?17*60:24*60;return [s,f]}
// Upcoming dated sessions/events, skipping anything already finished today (Rarotonga time)
function nextSessions(n){const now=new Date(new Date().toLocaleString('en-US',{timeZone:'Pacific/Rarotonga'})),nm=now.getHours()*60+now.getMinutes(),t0=iso(today);
return allEvents().filter(e=>{const d=parse(e.date);if(!d||d<today)return false;return e.date!==t0||evSpan(e)[1]>nm}).slice(0,n).map(e=>({e,live:e.date===t0&&evSpan(e)[0]<=nm}))}
function whenLabel(x){const d=parse(x.e.date),days=Math.round((d-today)/864e5);return x.live?'On now':days===0?'Today':days===1?'Tomorrow':DAYN[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)}
function nextPanel(){const L=nextSessions(2);
if(!L.length)return `<div class="dh-t dnext"><div class="k">Next session</div><h2>Nothing scheduled</h2><p class="where">Check the calendar or our Facebook page for the next session.</p><div class="dh-b"><button class="btn" data-go="cal">See what's on</button></div></div>`;
const x=L[0],e=x.e,v=VENUES[e.place],lg=e.kind==='league';
const time=e.time?e.time.split('–').map(t=>t.trim()):[lg?'From 1pm':'All day'];
const what=e.kind==='dropin'?'Members drop-in':e.title;
const where=v?`${v.name}${v.short&&v.short!==v.name?` (${v.short})`:''} · ${v.area.replace(', Rarotonga','')}`:(e.place||'');
const acts=[v?`<a class="btn" href="${dirUrl(v)}" target="_blank" rel="noopener">Directions</a>`:'',lg?`<a class="btn ghost" href="${leagueUrl(e.league)}">Fixtures &amp; ladders</a>`:`<button class="btn ghost" data-go="cal">All sessions</button>`].join('');
const n2=L[1]?`<div class="then">Then <b>${esc(whenLabel(L[1]))} · ${esc(L[1].e.time?L[1].e.time.split('–')[0].trim():'From 1pm')} · ${esc(L[1].e.kind==='dropin'?'Drop-in':L[1].e.title)}${L[1].e.place?' · '+esc(L[1].e.place):''}</b></div>`:'';

try{const h=location.hash.slice(1);if(findView(h))cur=h;else{const s=localStorage.getItem('pci_tab');if(s&&findView(s))cur=s}}catch(e){}
function render(){
  const isPage=!TABS.some(t=>t[0]===cur);const on=isPage?'home':cur;
  document.getElementById('tabs').innerHTML=TABS.map(([k,t])=>`<button data-tab="${k}" class="${k===on?'on':''}" aria-current="${k===cur?'page':'false'}">${t}</button>`).join('');
  document.getElementById('app').innerHTML=(isPage?`<button class="back" data-go="home">← Home</button>`:'')+findView(cur)()+`<footer class="pres">Pickleball Cook Islands</footer>`;
  initCarousel();
}
document.addEventListener('click',e=>{
const cb=e.target.closest('[data-car]');if(cb){const v=cb.dataset.car;carGo(v==='prev'?carIdx()-1:v==='next'?carIdx()+1:+v);return}
if(e.target.closest('#themebtn')){mode=mode==='dark'?'light':'dark';try{localStorage.setItem('pci_mode',mode)}catch(_){}applyTheme();return}
  const ph=e.target.closest('[data-ph],[data-lbgo]');if(ph){const [k,n]=(ph.dataset.ph||ph.dataset.lbgo).split(':');openPhoto(k,+n);return}
  if(e.target.closest('[data-lbx]')||e.target.id==='lb'){document.getElementById('lb').hidden=true;return}
  const c=e.target.closest('[data-copy]');if(c){const v=c.dataset.copy;const done=()=>{c.textContent='Copied'};try{navigator.clipboard.writeText(v).then(done,()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('acct')||c);getSelection().removeAllRanges();getSelection().addRange(r)})}catch(_){}return}
  const gc=e.target.closest('[data-gc]');if(gc){gearCat=gc.dataset.gc;render();return}
  if(e.target.closest('a'))return;
  const t=e.target.closest('[data-tab],[data-go],[data-f]');if(!t)return;
  if(t.dataset.f){filt=t.dataset.f;render();return}
  if(t.dataset.f2)filt=t.dataset.f2;else if(t.dataset.go==='cal')filt='all';
  cur=t.dataset.tab||t.dataset.go;try{localStorage.setItem('pci_tab',cur)}catch(_){}
  render();window.scrollTo(0,0);
});
document.addEventListener('keydown',e=>{const v=document.getElementById('lb');if(!v||v.hidden)return;if(e.key==='Escape')v.hidden=true;const b=v.querySelector(e.key==='ArrowLeft'?'.lb-p':e.key==='ArrowRight'?'.lb-n':null);if(b)b.click()});
applyTheme();render();
</script>
</body>
</html>
