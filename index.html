<meta name="description" content="Pickleball Cook Islands: the club's new website is coming soon. Follow us on Facebook for news and sessions in Rarotonga.">
<title>Pickleball Cook Islands</title>
<meta name="theme-color" content="#061D01">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">

<!--
  Coming soon page, shown until launch. The real site is at preview.html (not linked from here, and
  hidden from search engines). To launch, see "Going live" in README.md.
-->
<style>
:root{--bg:#061D01;--fg:#FFFFFF;--mute:#9CB893;--acc:#39FF14;--ink:#061D01;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Barlow',Arial,Helvetica,sans-serif;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:440px}
img{width:180px;height:auto;display:block;margin:0 auto 32px}
h1{font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:800;text-transform:uppercase;
  font-size:clamp(44px,13vw,72px);line-height:.95;margin:0;letter-spacing:.01em}
h1 span{color:var(--acc)}
p{color:var(--mute);font-size:17px;line-height:1.5;margin:16px 0 28px}
a.fb{display:inline-block;background:var(--acc);color:var(--ink);text-decoration:none;border-radius:10px;padding:12px 22px;
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:800;text-transform:uppercase;font-size:18px;letter-spacing:.06em}
a.fb:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="assets/img/logo.png" width="260" height="104" alt="Pickleball Cook Islands">
  <h1>New website<br><span>coming soon</span></h1>
  <p>We're building a new home for pickleball in Rarotonga. Until then, find sessions, news and photos on our Facebook page.</p>
  <a class="fb" href="https://www.facebook.com/profile.php?id=61572906476405">Pickleball Cook Islands on Facebook</a>
</main>
</body>
</html>
